name: build_windows_exe
on:
  workflow_dispatch:
  push:
    branches:
    - claude/exciting-rubin-70wfkp
permissions:
  contents: read
jobs:
  build_windows_x86_64:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      # GitHub-hosted runners only have 4 cores, so trade runtime performance for build time.
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
    - name: Checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: Use the larger drive for build output
      shell: pwsh
      run: |
        Get-PSDrive -PSProvider FileSystem
        if (Test-Path 'D:\') {
          "CARGO_TARGET_DIR=D:\target" >> $env:GITHUB_ENV
        } else {
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE\target" >> $env:GITHUB_ENV
        }
    - name: Build zed.exe
      shell: pwsh
      run: cargo build --release --package zed --package cli
    - name: Collect executables
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item "$env:CARGO_TARGET_DIR\release\zed.exe" dist\
        Copy-Item "$env:CARGO_TARGET_DIR\release\cli.exe" dist\
        Get-ChildItem dist
    - name: Upload executables
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-windows-x86_64
        path: dist
        if-no-files-found: error
